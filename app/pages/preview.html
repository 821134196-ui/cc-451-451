<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规格预览 · 自助证件照</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main>
  <h1>规格预览</h1>
  <div class="card" style="margin-bottom:14px">
    <div class="row">
      <div class="field" style="flex:1">
        <label>排队号 / 订单号</label>
        <input id="order-input" placeholder="如 0926-001 或订单 ID" style="width:100%">
      </div>
      <button onclick="enterOrder()">进入</button>
    </div>
    <div id="info" class="muted"></div>
  </div>

  <div class="grid cards-2">
    <section class="card">
      <h3>裁切安全线预览</h3>
      <div id="stage-wrap"></div>
      <div class="muted" id="crop-desc" style="margin-top:10px"></div>
      <h3>裁切框微调（px）</h3>
      <div class="row">
        <button class="ghost" onclick="nudge('x',-20)">← 左移</button>
        <button class="ghost" onclick="nudge('x',20)">右移 →</button>
        <button class="ghost" onclick="nudge('y',-20)">↑ 上移</button>
        <button class="ghost" onclick="nudge('y',20)">下移 ↓</button>
        <button class="danger" onclick="forceOutOfBounds()">越界测试</button>
        <button class="secondary" onclick="resetCrop()">复位</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btn-crop-confirm" onclick="confirmWithCrop()">按此裁切确认所选</button>
        <a class="btn ghost" id="back-select" href="#">返回候选选择</a>
      </div>
    </section>

    <section class="card">
      <h3>规格与候选符合性</h3>
      <div id="spec-info"></div>
      <table style="margin-top:8px">
        <thead><tr><th>候选</th><th>头高</th><th>顶距</th><th>结果</th></tr></thead>
        <tbody id="spec-rows"></tbody>
      </table>
      <p class="muted">规格不符的候选若被确认，订单将强制进入“待修正”队列由人工处理；
        裁切框移出原始画面范围时后端拒绝（裁切越界）。</p>
    </section>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/preview.js"></script>
</body>
</html>
